[package]
name = "rusty-notepad"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = "0.29"
rfd = "0.15"
chrono = "0.4"
ureq = { version = "2", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
sysinfo = "0.32"

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
